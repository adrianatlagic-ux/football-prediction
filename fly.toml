app = "football-prediction"
primary_region = "iad"

[build]

[env]
  # The server keeps its own schedule (src/scheduler.py).
  ENABLE_SCHEDULER = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
