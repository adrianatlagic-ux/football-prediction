name: Refresh predictions from named squads

# Every quarter hour: the script itself decides what is due, so a delayed run
# still catches its fixtures instead of skipping them. Scheduled runs on
# GitHub are routinely late by minutes, which is why the window is 75 minutes
# wide rather than a single instant at T-60.
on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: squad-prediction-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # The model artifacts are not in the repository (*.joblib is ignored),
      # so this step has to put them in place before anything can predict.
      # Without them the script fails loudly rather than writing a cache full
      # of untouched predictions that look refreshed.
      - name: Fetch model artifacts
        env:
          MODEL_ARTIFACT_URL: ${{ secrets.MODEL_ARTIFACT_URL }}
        run: |
          if [ -z "$MODEL_ARTIFACT_URL" ]; then
            echo "MODEL_ARTIFACT_URL is not set - no model to predict with." >&2
            exit 1
          fi
          curl -fsSL "$MODEL_ARTIFACT_URL" -o models.tar.gz
          tar xzf models.tar.gz

      - name: Recompute fixtures near kickoff
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python3 scripts/refresh_squad_predictions.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/predictions_cache
          git diff --cached --quiet || git commit -m "Refresh predictions from named squads [skip ci]"
          git push
