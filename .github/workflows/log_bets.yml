name: Log bets and combos

# Runs independently of any chat session, so the bet log stays complete even
# when nobody is actively working on the repo. log_bets.py only logs a match
# once it's within 30 minutes of kickoff (see FIRST_LOG_WINDOW_HOURS in the
# script), so a 15-minute interval is frequent enough to catch every match
# without ever missing its window.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Log current bets
        run: python3 scripts/log_bets.py --api https://football-prediction.fly.dev

      # Both combo rules, shown and old, in the hour before each ticket's
      # first kickoff (scripts/log_combos.py).
      - name: Log combo tickets
        run: python3 scripts/log_combos.py --api https://football-prediction.fly.dev

      # The ★ box's track record: archive plus every logged bet since graded.
      - name: Update the model's track record
        # Once a day is enough (the first run after 05:00 UTC); the rest skip.
        run: |
          if [ "$(date -u +%H)" = "05" ] && [ "$(date -u +%M)" -lt 15 ]; then
            pip install -q -r requirements.txt
            python3 scripts/build_model_track_record.py --api https://football-prediction.fly.dev
          fi

      - name: Commit if the log changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bet_log.jsonl data/combo_log.jsonl data/model_track_record.json
          git diff --cached --quiet || git commit -m "Log Champions League bets [skip ci]"
          git push
