name: Log club tips and results

# Append snapshots within 24h before kickoff. Scheduled runs can be delayed;
# missing games are not backfilled with hindsight predictions or live odds.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: club-tip-logging
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Log current bets
        run: python3 scripts/log_club_bets.py --api https://football-prediction.fly.dev

      - name: Evaluate recorded pre-match tips
        if: always()
        run: python3 scripts/audit_club_bets.py

      - name: Commit if the log changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/club_bet_snapshots.jsonl data/club_results.jsonl data/club_bet_performance.json
          git diff --cached --quiet || git commit -m "Log club tips and results [skip ci]"
          git push
